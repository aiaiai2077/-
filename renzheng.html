<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <style>
        body {
            background-color: #141414;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }
        
        .main-content {
            width: 100%;
            padding-top: calc(env(safe-area-inset-top) + 10px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            margin-bottom: 18px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            background-color: #333;
            background-image: url('https://photo.lily.lat/file/AgACAgQAAyEGAASLgSpZAAIFtmhT-GPeFKCpZgcTIpwjYe-pIEUkAALExzEbKwyhUo_50r6VMv17AQADAgADeQADNgQ.jpeg');
            background-size: cover;
            background-position: center;
        }
        
        .title {
            font-size: 17px;
            font-weight: 500;
            margin-bottom: 24px;
            color: white;
            letter-spacing: 0.3px;
            text-align: center;
        }
        
        .certification-box {
            background-color: #2a2a2a4D;
            width: calc(100% - 40px);
            max-width: 360px;
            padding: 22px 18px;
            border-radius: 12px;
        }
        
        .certification-title {
            font-size: 16px; 
            font-weight: 500;
            margin-bottom: 25px; 
            letter-spacing: 0.1px;
            color: #e0e0e0; 
        }
        
        .certification-item {
            font-size: 17px; 
            display: flex;
            line-height: 1.4;
        }
        
        .certification-item span:first-child {
            color: #999; 
            width: 85px; 
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="avatar"></div>
        <div class="title">无忧传媒</div>
        <div class="certification-box">
            <div class="certification-title">认证详情</div>
            <div class="certification-item">
                <span>真实姓名</span>
                <span>嬴政</span>
            </div>
        </div>
    </div>
</body>
</html>
